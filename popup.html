<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Vagas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>🤖 Máquina de Vagas</h1>
    <p class="subtitle">Autofill + captura via API do Hermes</p>
  </header>

  <main>
    <section class="card">
      <label class="field-label" for="apiUrl">URL da API do Hermes</label>
      <input type="text" id="apiUrl" placeholder="http://127.0.0.1:8790" spellcheck="false">
    </section>

    <section class="actions">
      <button id="btnTest" class="btn btn-ghost">Testar conexão</button>
      <button id="btnAutofill" class="btn btn-primary">✨ Autopreencher formulário</button>
      <button id="btnCapture" class="btn btn-secondary">📥 Capturar vaga</button>
      <button id="btnCv" class="btn btn-secondary">📄 Gerar CV p/ esta vaga</button>
    </section>

    <div id="status" class="status" hidden></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
